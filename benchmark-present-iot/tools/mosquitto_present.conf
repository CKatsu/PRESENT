# Konfigurasi Mosquitto 2.x UNTUK PENGUJIAN AKADEMIK (jaringan lokal tepercaya) -- BUKAN produksi.
# Tanpa autentikasi & tanpa TLS: sengaja, agar Wireshark dapat menangkap paket dan
# membuktikan bahwa payload yang lewat adalah ciphertext (kerangka bagian 7).
# Jalankan:   mosquitto -c tools/mosquitto_present.conf -v
listener 1883 0.0.0.0
allow_anonymous true
max_queued_messages 10000
max_inflight_messages 1000

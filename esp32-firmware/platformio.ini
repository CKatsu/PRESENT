; PlatformIO -- firmware streaming sensor terenkripsi PRESENT-CBC + PRESENT-CBC-MAC (ESP32-S3)
;
; Board: modul "ESP32-S3 N16R8" (Flash 16MB Quad SPI + PSRAM 8MB Octal SPI). Base board =
; definisi generik esp32-s3-devkitc-1 dengan override flash/PSRAM (sama seperti proyek SPECK).
; Dua environment (beda jalur komunikasi, algoritma & format sama):
;   pio run -e esp32s3-uart -t upload   -> UART/USB-Serial ke PC (receiver_server.py --uart-port COMx)
;   pio run -e esp32s3-mqtt -t upload   -> WiFi + MQTT ke broker Mosquitto (isi include/secrets.h)
; Panjang kunci: -DPRESENT_KEY_BITS=80 atau 128 (build_flags di bawah).
; Toolchain BELUM bisa diunduh di lingkungan pengembangan saya -> jalankan `pio run` (compile
; saja) lebih dulu di komputer Anda. Lihat README bagian Firmware.

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
upload_speed = 921600
monitor_filters = time, colorize
build_unflags = -std=gnu++11
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -std=gnu++17
    -O2
    -DPRESENT_KEY_BITS=128
lib_deps =
    adafruit/Adafruit BME280 Library @ ^2.2.4
    adafruit/Adafruit Unified Sensor @ ^1.1.14

[env:esp32s3-uart]
; upload_port = COM5
; monitor_port = COM5

[env:esp32s3-mqtt]
build_flags =
    ${env.build_flags}
    -DPRESENT_TRANSPORT_MQTT
lib_deps =
    ${env.lib_deps}
    knolleary/PubSubClient @ ^2.8
